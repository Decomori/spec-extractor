<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Spec Extractor · 사양 읽기</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202b39;background:#f5f7fa;--muted-foreground:#526276;--border:#dae1e9}*{box-sizing:border-box}body{margin:0;padding:32px 18px}#spec-reader{max-width:1040px;margin:auto;background:white;border:1px solid #dae1e9;border-radius:16px;padding:28px}h2{font-size:25px}h3{font-size:16px}.text-small{font-size:13px}.text-muted{color:#526276}.viz-controls,.viz-row{display:flex;flex-wrap:wrap;gap:12px}.viz-controls>*{flex:1;min-width:200px}.form-label{display:block;font-size:14px;margin:12px 0}input,select,textarea{display:block;width:100%;margin-top:7px;padding:10px;border:1px solid #b8c5d3;border-radius:7px;background:white;font:inherit;color:inherit}button{font:inherit;cursor:pointer;padding:8px 12px;border:1px solid #b8c5d3;border-radius:7px;background:white;color:#254a7b}.btn-primary{background:#244d7b;color:white}.viz-badge{padding:6px 10px;border-radius:7px;background:#edf2f8;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid #e1e7ee;text-align:left;vertical-align:top;overflow-wrap:anywhere}.table thead{background:#f5f7fa}.table tbody th{font-weight:500}summary{cursor:pointer}.text-destructive{color:#a12323}.field-detail{background:#f6f8fb;padding:14px!important}hr{border:0;border-top:1px solid #dae1e9;margin-top:28px}#sr-count{margin:14px 0}#sr-content{min-height:120px}@media(max-width:600px){body{padding:8px}#spec-reader{padding:14px}.table th,.table td{padding:10px 5px;font-size:13px}.btn{padding:6px}h2{font-size:21px}}
</style></head><body><style>
#spec-reader .section{margin-block:18px}#spec-reader .heading{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}#spec-reader .spec-group{margin-block:14px}#spec-reader summary{padding-block:10px}#spec-reader .field-detail{padding-block:8px;overflow-wrap:anywhere}#spec-reader .field-detail dl{display:grid;grid-template-columns:80px 1fr;gap:8px;margin:10px 0}#spec-reader dt{color:var(--muted-foreground)}#spec-reader dd{margin:0;white-space:pre-wrap}#spec-reader blockquote{margin:8px 0;padding-inline-start:12px;border-inline-start:2px solid var(--border);white-space:pre-wrap}#spec-reader .table{table-layout:fixed}#spec-reader .col-label{width:29%}#spec-reader .col-value{width:43%}#spec-reader .col-status{width:28%}#spec-reader .meta{overflow-wrap:anywhere}#spec-reader .notice{margin-block:12px}#spec-reader .input-area{margin-block:12px}#spec-reader .group-title{font-weight:500}#spec-reader .empty{padding-block:24px}#spec-reader .unit{white-space:nowrap}#spec-reader h2{margin-bottom:8px}#spec-reader .action-row{margin-block:12px}#spec-reader .row-detail[hidden]{display:none}
</style>
<div id="spec-reader">
<div class="heading"><h2 id="sr-title">사양 읽기</h2><span class="text-small text-muted">Spec Extractor · 원문 근거 보기</span></div>
<div id="sr-subtitle" class="text-small text-muted meta"></div>
<div class="section viz-controls">
<label class="form-label">제품 / 옵션<select id="sr-product" class="form-select"></select></label>
<label class="form-label">보기<select id="sr-view" class="form-select"><option value="all">전체 사양</option><option value="review">확인 필요한 항목</option><option value="difference">같은 제품의 옵션 간 차이</option></select></label>
</div>
<label class="form-label">항목 검색<input id="sr-search" type="search" placeholder="항목명 또는 값 검색"></label>
<div id="sr-count" class="viz-row" aria-live="polite"></div>
<div id="sr-product-note" class="text-small text-muted notice"></div>
<div id="sr-content"></div>
<hr>
<details class="section"><summary class="cursor-interaction">출처와 추출 범위</summary><div id="sr-sources" class="meta"></div><ul id="sr-notes"></ul><div class="text-small text-muted">출처 인용은 입력 데이터 기준입니다. 원문 내용의 정확성을 자동 보증하지 않습니다.</div></details>
<details class="section"><summary class="cursor-interaction">다른 추출 결과 열기</summary>
<label class="form-label input-area">Spec Extractor JSON<textarea id="sr-input" class="form-control" rows="6" placeholder="schema_version, sources, products가 있는 JSON을 붙여넣으세요."></textarea></label>
<div class="viz-row action-row"><button type="button" id="sr-load" class="btn btn-primary">사양 열기</button><button type="button" id="sr-example" class="btn">처음 자료로 돌아가기</button></div>
<div id="sr-error" role="alert" class="text-destructive"></div><div class="text-small text-muted">입력한 자료는 이 화면에서만 처리됩니다.</div>
</details>
<script type="application/json" id="sr-data">__SPEC_DATA__</script>
</div>
<script>
(()=>{
const root=document.getElementById('spec-reader');const $=id=>root.querySelector('#'+id);
const original=JSON.parse($('sr-data').textContent);let data=original;
const labels={product_name:'상품명',lamp_count:'광원 수',dimensions:'본체 크기',connector_dimensions:'커넥터 크기',rotation:'각도 조절',beam_angle:'배광각',body_color_options:'색상 선택지',material:'소재',power:'소비전력',cct:'색온도',light_color:'빛 색상',luminous_flux:'광속',luminous_efficacy:'광효율',cri:'연색성',rated_current:'정격전류',power_factor:'역률',emc_registration_number:'전자파 등록번호',certification_information:'인증 안내',certification_number:'인증 번호',country_of_manufacture:'제조국',input_voltage:'입력전압',frequency:'주파수',manufacturer_importer:'제조사 / 수입사',installation:'설치 방식',flicker_free_claim:'플리커프리 표기',diagram_dimensions:'치수도 표기',model:'모델번호',ip_rating:'방진·방수 등급',driver:'드라이버',cutout:'타공 치수',lifetime:'정격 수명',dimming:'조광',weight:'중량',warranty:'보증기간',rail_standard:'레일 호환 규격',input_current_type:'AC / DC 구분',label_small_print:'작은 라벨 문자',body_color:'본체 색상'};
const status={sourced:'원문 기재',derived:'계산값',missing:'검토 범위에서 미확인',illegible:'판독 불가',conflict:'출처 충돌',not_applicable:'해당 없음'};
const groups=[['주요 사양',['product_name','model','dimensions','weight','material']],['추가 사양',[]]];
const text=v=>v==null?'—':typeof v==='object'?JSON.stringify(v,null,2):String(v);
function el(tag,content,cls){const n=document.createElement(tag);if(content!==undefined)n.textContent=content;if(cls)n.className=cls;return n;}
function fieldValue(f){if(f.value==null)return status[f.status]||'값 없음';const value=typeof f.value==='object'&&f.raw_value?String(f.raw_value):text(f.value);return value+(f.unit&&!value.includes(f.unit)?' '+f.unit:'');}
function label(p){const name=p.fields.find(f=>f.key==='product_name')?.value||p.product_id;const color=p.fields.find(f=>f.key==='body_color')?.value;return text(name)+' · '+(color?text(color)+' / ':'')+p.variant_id;}
function persist(){}
function evidence(parent,items){for(const e of items||[]){const source=data.sources.find(s=>s.id===e.source_id);parent.append(el('div',(source?.file||e.source_id)+' · '+(e.locator||''),'text-small text-muted'));parent.append(el('blockquote',e.quote||'인용문 없음'));if(e.bbox_px)parent.append(el('div','근거 영역: '+text(e.bbox_px)+' · '+text(e.coordinate_space),'text-small text-muted'));}}
function detail(f){const box=el('div',undefined,'field-detail');const dl=el('dl');for(const [k,v] of [['항목 코드',f.key],['원문 표기',f.raw_value],['정리된 값',f.value],['단위',f.unit]]){dl.append(el('dt',k),el('dd',text(v)));}box.append(dl);if(f.notes)box.append(el('p',f.notes));if(f.derivation)box.append(el('p','계산 근거: '+f.derivation));if(f.evidence?.length)evidence(box,f.evidence);else box.append(el('p','연결된 원문 인용 없음','text-small text-muted'));for(const [i,c] of (f.candidates||[]).entries()){box.append(el('h3','충돌 후보 '+(i+1)),el('p',text(c.raw_value)+' · '+text(c.value)+(c.unit?' '+c.unit:'')));evidence(box,c.evidence);}return box;}
function render(){const p=data.products[+$('sr-product').value];const mode=$('sr-view').value;$('sr-title').textContent=text(p.fields.find(f=>f.key==='product_name')?.value||p.product_id);$('sr-subtitle').textContent=data.products.length+'개 옵션 · 출처 '+data.sources.length+'개 · 문서의 표기이며 외부 검증 아님';$('sr-product-note').textContent=p.notes||'';
const counts={};p.fields.forEach(f=>counts[f.status]=(counts[f.status]||0)+1);$('sr-count').replaceChildren(...Object.entries(counts).map(([s,n])=>el('span',status[s]+' '+n+'개','viz-badge')));
let fields=p.fields;const query=$('sr-search').value.trim().toLowerCase();const peers=data.products.filter(x=>x.product_id===p.product_id);const signature=f=>f?JSON.stringify([f.status,f.value,f.unit,f.raw_value,f.candidates]):'absent';
if(mode==='review')fields=fields.filter(f=>['missing','illegible','conflict'].includes(f.status));
if(mode==='difference')fields=fields.filter(f=>peers.some(q=>signature(q.fields.find(x=>x.key===f.key))!==signature(f)));
if(query)fields=fields.filter(f=>[labels[f.key]||f.key,f.key,text(f.value),text(f.raw_value)].join(' ').toLowerCase().includes(query));
const content=$('sr-content');content.replaceChildren();if(!fields.length)content.append(el('div',mode==='difference'?(peers.length<2?'비교할 다른 옵션이 없습니다.':'현재 옵션의 항목에서 값·상태 차이가 없습니다.'):'이 보기에 해당하는 항목이 없습니다.','empty'));
const assigned=new Set();const sections=groups.map(([name,keys])=>[name,fields.filter(f=>keys.includes(f.key))]);sections.forEach(([,fs])=>fs.forEach(f=>assigned.add(f.key)));sections.push(['기타 사양',fields.filter(f=>!assigned.has(f.key))]);
for(const [name,fs] of sections){if(!fs.length)continue;const group=el('details',undefined,'spec-group');group.open=mode!=='all'||name==='주요 사양';group.append(el('summary',name+' · '+fs.length+'개','cursor-interaction group-title'));
const table=el('table',undefined,'table table-sm');const colgroup=el('colgroup');for(const c of ['col-label','col-value','col-status'])colgroup.append(el('col',undefined,c));table.append(colgroup);const head=el('thead');const hr=el('tr');['항목','사양','상태 / 근거'].forEach(t=>{const th=el('th',t);th.scope='col';hr.append(th)});head.append(hr);table.append(head);const body=el('tbody');
for(const f of fs){const tr=el('tr');const key=el('th',labels[f.key]||f.key);key.scope='row';const val=el('td',fieldValue(f));if(mode==='difference'){for(const q of peers.filter(q=>q!==p)){const other=q.fields.find(x=>x.key===f.key);val.append(el('div',q.variant_id+': '+(other?fieldValue(other):'항목 없음'),'text-small text-muted'));}}
const st=el('td');st.append(el('div',status[f.status]));const btn=el('button','근거 보기','btn btn-ghost');btn.type='button';btn.setAttribute('aria-label',(labels[f.key]||f.key)+' 근거 보기');btn.setAttribute('aria-expanded','false');st.append(btn);tr.append(key,val,st);const extra=el('tr',undefined,'row-detail');extra.hidden=true;const cell=el('td');cell.colSpan=3;cell.append(detail(f));extra.append(cell);btn.onclick=()=>{extra.hidden=!extra.hidden;btn.setAttribute('aria-expanded',String(!extra.hidden));btn.textContent=extra.hidden?'근거 보기':'근거 닫기';};body.append(tr,extra);}table.append(body);group.append(table);content.append(group);}
$('sr-sources').replaceChildren(...data.sources.map(s=>{const d=el('div');d.append(el('h3',s.id+' · '+s.file),el('div',[s.kind,s.width_px&&s.height_px?s.width_px+' × '+s.height_px+' px ('+(s.measurement==='decoded_received_file'?'수신 파일 측정':'입력값 · 측정 여부 미확인')+')':''].filter(Boolean).join(' · '),'text-small text-muted'));if(s.sha256){const meta=el('details');meta.append(el('summary','원본 해시','cursor-interaction text-small'),el('div',s.sha256,'text-small meta'));d.append(meta);}return d;}));$('sr-notes').replaceChildren(...(data.extraction_notes||[]).map(n=>el('li',text(n))));
}
function setup(index=0,view='all'){$('sr-search').value='';$('sr-product').replaceChildren(...data.products.map((p,i)=>{const o=el('option',label(p));o.value=i;return o;}));$('sr-product').value=String(index>=0&&index<data.products.length?index:0);$('sr-view').value=['all','review','difference'].includes(view)?view:'all';render();}
function validate(d){if(d?.schema_version!=='1.0'||!Array.isArray(d.sources)||!Array.isArray(d.products)||!d.products.length)throw Error('Spec Extractor 1.0 형식의 sources와 products가 필요합니다.');if(d.products.length>100)throw Error('한 번에 100개 이하의 옵션을 열어주세요.');const finite=v=>{if(typeof v==='number'&&!Number.isFinite(v))throw Error('표현할 수 없는 숫자가 있습니다.');if(v&&typeof v==='object')Object.values(v).forEach(finite);};finite(d);const ids=new Set();for(const s of d.sources){if(!s||typeof s.id!=='string'||typeof s.file!=='string'||ids.has(s.id))throw Error('출처 ID와 파일명을 확인해주세요.');ids.add(s.id);}const identities=new Set();for(const p of d.products){if(!p||typeof p.product_id!=='string'||typeof p.variant_id!=='string'||!Array.isArray(p.fields)||!p.fields.length)throw Error('제품 식별자와 fields 배열이 필요합니다.');const id=JSON.stringify([p.product_id,p.variant_id]);if(identities.has(id))throw Error('중복된 제품·옵션입니다.');identities.add(id);const keys=new Set();for(const f of p.fields){if(!f||typeof f.key!=='string'||keys.has(f.key)||!Object.hasOwn(status,f.status)||!Array.isArray(f.evidence))throw Error('항목 코드·상태·근거 형식을 확인해주세요.');keys.add(f.key);if(['missing','illegible','conflict','not_applicable'].includes(f.status)&&f.value!==null)throw Error('미확정 항목의 값은 null이어야 합니다.');for(const e of f.evidence){if(!e||!ids.has(e.source_id)||typeof e.locator!=='string'||typeof e.quote!=='string')throw Error('근거의 출처·위치·인용문을 확인해주세요.');}if(f.candidates!==undefined&&!Array.isArray(f.candidates))throw Error('충돌 후보는 배열이어야 합니다.');if(f.status==='conflict'&&(!f.candidates||f.candidates.length<2))throw Error('충돌 항목은 후보가 두 개 이상 필요합니다.');for(const c of f.candidates||[]){if(!c||c.value==null||typeof c.raw_value!=='string'||!Array.isArray(c.evidence)||!c.evidence.length)throw Error('충돌 후보의 값과 근거를 확인해주세요.');for(const e of c.evidence){if(!e||!ids.has(e.source_id)||typeof e.locator!=='string'||typeof e.quote!=='string')throw Error('충돌 후보의 출처를 확인해주세요.');}}if(['sourced','derived'].includes(f.status)&&(f.value==null||!f.evidence.length))throw Error('원문 기재·계산 항목은 값과 근거가 필요합니다.');}}if(d.extraction_notes!==undefined&&!Array.isArray(d.extraction_notes))throw Error('추출 메모는 배열이어야 합니다.');}
$('sr-search').oninput=()=>render();
$('sr-product').onchange=()=>{render();persist();};$('sr-view').onchange=()=>{render();persist();};
$('sr-load').onclick=()=>{try{let s=$('sr-input').value.trim();if(s.length>500000)throw Error('입력은 500,000자 이하로 나눠주세요.');s=s.replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'');const next=JSON.parse(s);validate(next);data=next;setup();$('sr-error').textContent='';}catch(e){$('sr-error').textContent='열지 못했습니다: '+e.message;}};
$('sr-example').onclick=()=>{data=original;setup();$('sr-input').value='';$('sr-error').textContent='';persist();};
setup();
})();
</script>
</body></html>
